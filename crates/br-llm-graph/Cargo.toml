[package]
name = "br-llm-graph"
version = "0.3.0"
description = "LangGraph-like orchestration over br-llm-messages: typed state, async nodes, sync edges, supersteps, react loop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "v0.2.0", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = "0.3"
futures-channel = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
