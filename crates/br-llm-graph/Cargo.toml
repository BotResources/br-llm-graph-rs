[package]
name = "br-llm-graph"
version = "0.4.0"
description = "LangGraph-like orchestration over br-llm-messages and br-llm-clients-core: typed state, async nodes, sync edges, supersteps, LLM calls, react loop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", tag = "br-llm-messages/v0.4.0", version = "0.4.0" }
br-llm-clients-core = { git = "https://github.com/BotResources/br-llm-clients-rs", tag = "br-llm-clients-core/v0.3.0", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = "0.3"
futures-channel = "0.3"

[dev-dependencies]
# The mock is taken from the release tag of br-llm-clients-core 0.3.0, which
# names the same commit as br-llm-clients-mock/v0.3.0: a git dependency's
# source is its tag, so pinning the mock on its own tag would build a second
# br-llm-clients-core from that source, whose `Client` is not the graph's.
br-llm-clients-mock = { git = "https://github.com/BotResources/br-llm-clients-rs", tag = "br-llm-clients-core/v0.3.0", version = "0.3.0" }
tokio = { version = "1", features = ["rt", "macros"] }
