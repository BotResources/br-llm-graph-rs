name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --all-features --locked

  msrv:
    name: MSRV 1.89 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv
      - run: cargo build --locked

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  unused-deps:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-machete
      - run: cargo machete

  semver:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: semver
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks against the previous tag
        run: |
          set -euo pipefail
          baseline=$(git tag --list 'v*' | sort -V | tail -n1)
          if [ -z "$baseline" ]; then
            echo "::notice::no prior v* tag, skipping semver-checks (first release)"
            exit 0
          fi
          crate=br-llm-graph
          lib="${crate//-/_}"
          base_wt="$(mktemp -d)/baseline"
          git worktree add --detach "$base_wt" "$baseline"
          trap 'git worktree remove --force "$base_wt" 2>/dev/null || true; git worktree prune' EXIT
          rustdoc_json() {
            local dir="$1" out="$2"
            ( cd "$dir" && RUSTC_BOOTSTRAP=1 \
              RUSTDOCFLAGS="-Z unstable-options --output-format json --cap-lints allow" \
              cargo doc -p "$crate" --lib --no-deps --all-features --locked \
              --target-dir "$out" )
          }
          rustdoc_json "." "$PWD/target/semver-current"
          rustdoc_json "$base_wt" "$base_wt/target/semver-baseline"
          cargo semver-checks -p "$crate" \
            --baseline-rustdoc "$base_wt/target/semver-baseline/doc/${lib}.json" \
            --current-rustdoc "$PWD/target/semver-current/doc/${lib}.json"

  changelog:
    name: changelog entry per Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: check changelog entry
        run: bash .github/scripts/check-changelog.sh
      - name: check README tag pins are fresh
        run: bash .github/scripts/check-readme-pins.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: shellcheck .github/scripts
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck --severity=warning .github/scripts/*.sh

  trufflehog:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --results=verified,unknown
